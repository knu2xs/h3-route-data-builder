site_name: H3 Route Data Builder 0.0.0

docs_dir: mkdocs
site_dir: ../docs

nav:
  - Home: index.md
  - Design:
      - Product Vision: design/00-product-vision.md
      - Shared Constitution: design/01-shared-constitution.md
      - System Architecture: design/02-system-architecture.md
      - Data Contract: design/03-data-contract.md
      - Test Strategy: design/09-test-strategy.md
      - Roadmap: design/10-roadmap.md
      - Builder Features:
          - AOI Cell Generation and Snapping: design/builder/001-aoi-cell-generation-and-snapping.md
          - Candidate Generation: design/builder/002-candidate-generation.md
          - Resumable OD Solving: design/builder/003-resumable-od-solving.md
          - GeoParquet Publication: design/builder/004-geoparquet-publication.md
          - Parallel Execution: design/builder/005-parallel-execution.md
  - Configuration: configuration.md
  - API: api.md
  - Cookiecutter Reference: cookiecutter_reference.md


repo_url: https://github.com/knu2xs/h3-route-data-builder
repo_name: h3-route-data-builder


theme:
  name: material

  # use a globe because...duh, geography!
  icon:
    logo: fontawesome/solid/globe-americas

  features:
    - content.code.copy
    - content.code.select

  palette:

    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      primary: blue
      accent: green
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg


plugins:
  # enable lightbox, enlarging images
  - glightbox

  # extension converting included notebooks into html at build time
  - mkdocs-jupyter:
      include_source: True

  # extension to include markdown files within other markdown files
  - include-markdown:
      encoding: utf-8
      preserve_includer_indent: false
      dedent: false
      trailing_newlines: true
      comments: true
      rewrite_relative_urls: true
      heading_offset: 0
      start: <!--start-->
      end: <!--end-->
      recursive: true

  # extension handling pulling docstrings from Python package
  - mkdocstrings:

      # explicitly enable generation of objects.ini facilitating intersphinx mapping
      enable_inventory: true

      # optional: do not show the root heading of the documented module
      show_root_heading: false

      handlers:
        python:

          # where to find the local package
          paths: [../src]

          # referenced python objects will be linked
          inventories:
          - https://docs.python.org/3/objects.inv
          - https://pandas.pydata.org/docs/objects.inv
          - https://scikit-learn.org/stable/objects.inv

          # use Google docstrings style
          options:
            docstring_style: google
