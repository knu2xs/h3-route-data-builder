[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]

name = "h3-route-data-builder"

version = "0.0.0"

authors = [
  { name="Joel McCune"},
]

description = "ArcPy pipeline that builds sparse, resumable H3 origin-destination network cost datasets published as GeoParquet."

readme = "README.md"

requires-python = ">=3.11"

classifiers = [
    "Programming Language :: Python :: 3",
]


license = {text = "Apache-2.0"}


dependencies = [
    "h3>=4.0",
    "duckdb>=1.3.2",
    "pyarrow>=22.0",
    # "arcpy-parquet @ git+https://github.com/knu2xs/arcpy-parquet.git",
    
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["h3_route_data_builder*"]

[tool.setuptools.package-data]
"h3_route_data_builder.sql" = ["*.sql"]
